name: Update metrics

on:
  schedule:
    # Runs daily at 00:00 UTC (07:00 Ho Chi Minh)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Token setup: https://github.com/lowlighter/metrics#-setup
      # METRICS_TOKEN = fine-grained PAT (public repos, no extra scopes needed).
      - name: Most used languages (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.light.svg
          base: ""
          template: classic
          config_timezone: Asia/Ho_Chi_Minh
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_indepth: auto
          plugin_languages_ignored: >-
            ledinhbach2k4/bro-shop,
            ledinhbach2k4/TechTopStore-Website-JavaScript,
            ledinhbach2k4/YouTubeDownloader
          plugin_languages_skipped: >-
            premiere/premiere

      - name: Most used languages (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.dark.svg
          base: ""
          template: classic
          config_timezone: Asia/Ho_Chi_Minh
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_indepth: auto
          plugin_languages_ignored: >-
            ledinhbach2k4/bro-shop,
            ledinhbach2k4/TechTopStore-Website-JavaScript,
            ledinhbach2k4/YouTubeDownloader
          plugin_languages_skipped: >-
            premiere/premiere
          extras_css: |-
            svg{background-color:#0d1117!important;color:#8b949e!important}
            h1,h2,h3{color:#58a6ff!important}
            .field svg{fill:#8b949e!important}
            .field.language.details small,footer{color:#8b949e!important}
            code,.code{color:#8b949e!important;background-color:#30363d!important}
            .label{color:#58a6ff!important}

      - name: Contribution calendar (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.light.svg
          base: ""
          template: classic
          config_timezone: Asia/Ho_Chi_Minh
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Contribution calendar (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.dark.svg
          base: ""
          template: classic
          config_timezone: Asia/Ho_Chi_Minh
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          extras_css: |-
            svg{background-color:#0d1117!important;color:#8b949e!important}
            h1,h2,h3{color:#58a6ff!important}
            .field svg{fill:#8b949e!important}
            .field.language.details small,footer{color:#8b949e!important}
            code,.code{color:#8b949e!important;background-color:#30363d!important}
            .label{color:#58a6ff!important}
            .calendar .day{outline-color:rgba(240,246,252,.1)!important}
            :root{--color-calendar-graph-day-bg:#0d1117;--color-calendar-graph-day-border:rgba(240,246,252,.1);--color-calendar-graph-day-L1-bg:#0e4429;--color-calendar-graph-day-L2-bg:#006d32;--color-calendar-graph-day-L3-bg:#26a641;--color-calendar-graph-day-L4-bg:#39d353;--color-calendar-graph-day-L4-border:rgba(240,246,252,.1);--color-calendar-graph-day-L3-border:rgba(240,246,252,.1);--color-calendar-graph-day-L2-border:rgba(240,246,252,.1);--color-calendar-graph-day-L1-border:rgba(240,246,252,.1)}